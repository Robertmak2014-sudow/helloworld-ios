name: Build IPA from Swift Package (Legacy Method)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4.0'
    - name: List Available Schemes
      run: |
        xcodebuild -list

    - name: Generate Xcode project from Swift Package
      run: |
        xcodebuild \
          -scheme "ClickerApp" \
          -sdk iphoneos \
          -destination "generic/platform=iOS" \
          -configuration Release \
          -derivedDataPath ./build \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          OTHER_CODE_SIGN_FLAGS="" \
          SWIFT_COMPILATION_MODE=wholemodule \
          OTHER_SWIFT_FLAGS="-parse-as-library" \
          build

    - name: Extract Binary from Build Products
      id: extract-binary
      run: |
        BINARY_PATH=$(find ./build/Build/Products/Release-iphoneos -name "ClickerApp" -type f | head -n1)
        if [ -n "$BINARY_PATH" ]; then
          echo "binary-path=$BINARY_PATH" >> $GITHUB_OUTPUT
          echo "Found binary: $BINARY_PATH"
        else
          echo "Binary not found in build products"
          exit 1
        fi

    - name: Prepare IPA Structure
      run: |
        mkdir -p Payload/ClickerApp.app
        cp ${{ steps.extract-binary.outputs.binary-path }} Payload/ClickerApp.app/ClickerApp
        chmod +x Payload/ClickerApp.app/ClickerApp

    - name: Create Info.plist
      run: |
        cat > Payload/ClickerApp.app/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleDevelopmentRegion</key>
          <string>en</string>
          <key>CFBundleExecutable</key>
          <string>ClickerApp</string>
          <key>CFBundleIdentifier</key>
          <string>com.yourcompany.ClickerApp</string>
          <key>CFBundleInfoDictionaryVersion</key>
          <string>6.0</string>
          <key>CFBundleName</key>
          <string>ClickerApp</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>1.0</string>
          <key>CFBundleVersion</key>
          <string>1</string>
          <key>LSRequiresIPhoneOS</key>
          <true/>
          <key>UIRequiredDeviceCapabilities</key>
          <array>
            <string>arm64</string>
          </array>
        </dict>
        </plist>
        EOF

    - name: Create IPA File
      run: |
        cd Payload
        zip -r ../ClickerApp.ipa .
        cd ..

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClickerApp-ipa
        path: ClickerApp.ipa
