name: Build IPA from Swift Package Binary

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4.0'

    - name: Build Binary
      run: |
        swift build -c release --arch arm64

    - name: Prepare IPA Structure
      run: |
        mkdir -p Payload/ClickerApp.app
        cp .build/arm64-apple-macosx/release/YourPackageName Payload/ClickerApp.app/ClickerApp
        chmod +x Payload/ClickerApp.app/ClickerApp

    - name: Create Info.plist
      run: |
        cat > Payload/ClickerApp.app/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleDevelopmentRegion</key>
          <string>en</string>
          <key>CFBundleExecutable</key>
          <string>ClickerApp</string>
          <key>CFBundleIdentifier</key>
          <string>com.yourcompany.ClickerApp</string>
          <key>CFBundleInfoDictionaryVersion</key>
          <string>6.0</string>
          <key>CFBundleName</key>
          <string>ClickerApp</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>1.0</string>
          <key>CFBundleVersion</key>
          <string>1</string>
          <key>LSRequiresIPhoneOS</key>
          <true/>
          <key>UIRequiredDeviceCapabilities</key>
          <array>
            <string>arm64</string>
          </array>
        </dict>
        </plist>
        EOF

    - name: Create IPA File
      run: |
        cd Payload
        zip -r ../ClickerApp.ipa .
        cd ..

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClickerApp-ipa
        path: ClickerApp.ipa
