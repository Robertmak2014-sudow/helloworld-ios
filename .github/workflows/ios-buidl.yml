name: Build Clicker App for iOS 12.5.8

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios-app:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Project Structure
        run: |
          echo "📁 Project structure:"
          find . -type f \( -name "*.swift" -o -name "Package.swift" \) -exec ls -la {} \;
          echo "\n🗂️  Folder structure:"
          tree -a -I '.git|build' || ls -laR

      - name: Generate Xcode Project from Swift Package
        run: |
          swift package generate-xcodeproj
          echo "✅ Xcode project generated: ClickerApp.xcodeproj"

      - name: List Available Schemes
        id: list-schemes
        run: |
          schemes=$(xcodebuild -project ClickerApp.xcodeproj -list | grep -A 10 "Schemes:" | tail -n +2 | grep -v "^$" | tr -d '[:space:]')
          echo "schemes=$schemes" >> $GITHUB_OUTPUT
          echo "Available schemes: $schemes"

      - name: Build with xcodebuild
        run: |
          xcodebuild \
            -project ClickerApp.xcodeproj \
            -scheme ClickerApp \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_CODE_SIGN_FLAGS="" \
            SWIFT_COMPILATION_MODE=wholemodule \
            build

      - name: Create ZIP Archive of Project
        run: |
          # Создаём ZIP‑архив всей текущей папки (исключая служебные директории)
          zip -r project-archive.zip . \
            -x ".git/*" \
            -x "build/*" \
            -x "*.zip" \
            -x ".swiftpm/*" \
            -x "*.xcodeproj/*" \
            -x "*.xcworkspace/*"
          echo "✅ ZIP archive created: project-archive.zip"

      - name: Upload Project Archive as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-source-code
          path: project-archive.zip
          retention-days: 7

      - name: Upload Build Artifacts (Optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: ./build/**
          retention-days: 7
