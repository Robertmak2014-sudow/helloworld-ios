name: Build and Archive Project Folder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-zip:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Package Structure
        run: |
          echo "📁 Project structure:"
          find . -type f \( -name "*.swift" -o -name "Package.swift" \) -exec ls -la {} \;
          echo "🗂️  Folder structure:"
          tree -a -I '.git|build' || ls -laR

      - name: Build with Swift Package Manager
        run: |
          swift build --configuration release
          echo "✅ Swift package built successfully"

      - name: Generate Xcode Project (Optional)
        run: |
          swift package generate-xcodeproj
          echo "✅ Xcode project generated: ClickerApp.xcodeproj"

      - name: List Available Schemes
        run: |
          if [ -f "ClickerApp.xcodeproj" ]; then
            xcodebuild -project ClickerApp.xcodeproj -list
          else
            echo "No Xcode project found, using SPM build"
          fi

      - name: Xcode Build (if Xcode project exists)
        if: success() && contains(steps.list-schemes.outputs.schemes, 'ClickerApp')
        run: |
          xcodebuild \
            -project ClickerApp.xcodeproj \
            -scheme ClickerApp \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_CODE_SIGN_FLAGS="" \
            SWIFT_COMPILATION_MODE=wholemodule \
            build

      - name: Create ZIP archive of project folder
        run: |
          # Создаём ZIP‑архив всей текущей папки (исключая .git, build и временные файлы)
          zip -r project-archive.zip . \
            -x ".git/*" \
            -x "build/*" \
            -x "*.zip" \
            -x ".swiftpm/*"
          echo "✅ ZIP archive created: project-archive.zip"

      - name: Upload project archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-source-code
          path: project-archive.zip
          retention-days: 7
