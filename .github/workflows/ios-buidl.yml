name: Build Clicker App for iOS 12.5.8

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  build-ios-app:
    runs-on: macos-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Project Structure
        run: |
          echo "📁 Project structure:"
          find . -type f \( -name "*.swift" -o -name "Package.swift" \) -exec ls -la {} \;

      - name: Build with xcodebuild
        run: |
          xcodebuild \
            -scheme ClickerApp \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_CODE_SIGN_FLAGS="" \
            SWIFT_COMPILATION_MODE=wholemodule \
            OTHER_SWIFT_FLAGS="-parse-as-library" \
            build

      - name: Create ZIP Archive of Project
        run: |
          zip -r project-archive.zip . \
            -x ".git/*" \
            -x "build/*" \
            -x "*.zip" \
            -x ".swiftpm/*"
          echo "✅ ZIP archive created: project-archive.zip"

      - name: Upload Project Archive as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-source-code
          path: project-archive.zip
          retention-days: 7

      - name: Upload Build Artifacts (Optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: ./build/**
          retention-days: 7
